[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coding4game-gui"
version = "0.2.0"
description = "Windows game benchmark: open coding-agent CLI development, frozen programs and Direct GUI baseline"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.14"

dependencies = [
    "numpy",
    "pillow",
    "packaging",
    "opencv-python",
    "pyautogui",
    "pyyaml",
    "ruamel.yaml",
    "psutil",
    "litellm==1.84.0",
    "dxcam; sys_platform == 'win32'",
    "vgamepad==0.2.0; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",
    "xspeedhack; sys_platform == 'win32'",
    "paddleocr==3.7.0; sys_platform == 'win32'",
    # Paddle publishes the calibrated CUDA 11.8 Windows wheels outside PyPI.
    "paddlepaddle-gpu @ https://paddle-whl.cdn.bcebos.com/stable/cu118/paddlepaddle-gpu/paddlepaddle_gpu-3.3.1-cp311-cp311-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.11'",
    "paddlepaddle-gpu @ https://paddle-whl.cdn.bcebos.com/stable/cu118/paddlepaddle-gpu/paddlepaddle_gpu-3.3.1-cp312-cp312-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.12'",
    "paddlepaddle-gpu @ https://paddle-whl.cdn.bcebos.com/stable/cu118/paddlepaddle-gpu/paddlepaddle_gpu-3.3.1-cp313-cp313-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.13'",
    "anthropic",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["coding4game_gui*"]
exclude = ["scripts*", "tests*", "out*", "debug*", "games*"]

[tool.setuptools.package-data]
"coding4game_gui.benchmark" = ["scenarios/*.yaml"]
"coding4game_gui.benchmark.code" = ["prompts/*.md"]
"coding4game_gui.benchmark.windows" = ["palworld_save_inspector.mjs", "settings_templates/*.lua"]
"coding4game_gui.benchmark.windows.scorers" = ["templates/battleblock/*.png", "assets/**/*", "*.npz"]
"coding4game_gui.benchmark.windows.drivers.windows_xinput" = ["native_ime/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
