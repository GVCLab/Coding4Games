# Host-only configuration for the Claude API. Set C4G_MODEL_API_KEY before use.
# To use another provider, set its model ID, HTTPS endpoint, and key reference.
model_list:
  - model_name: my-model
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_base: https://api.anthropic.com
      api_key: os.environ/C4G_MODEL_API_KEY
