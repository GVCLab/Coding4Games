# Copy to litellm.config.yaml on the host. Never copy credentials into a box.
# Replace the provider model ID and endpoint before use.
model_list:
  - model_name: my-model
    litellm_params:
      model: openai/REPLACE_WITH_PROVIDER_MODEL_ID
      api_base: https://provider.example.invalid/v1
      api_key: os.environ/C4G_MODEL_API_KEY
