name: Brotato

# Confirm the exact process name with Task Manager after launch.
process: Brotato.exe

scorer:
  kind: ocr
  implementation: ocr

description: |
  Brotato: a top-down arena survival roguelite. Survive timed waves of
  aliens; enemies drop materials (currency + XP). Between waves you pick a
  level-up upgrade and can buy items/weapons in the shop. Movement is the
  left stick; combat is auto-aim/auto-fire. Menus (level-up, shop, death
  screen) are navigated with the D-pad and confirmed with A / cancelled
  with B. A run ends when HP reaches 0 (death screen shows the results).

# Brotato.exe calls SteamAPI_RestartAppIfNecessary when started directly, so
# launching it creates a noisy throwaway process before Steam starts the real
# game.  Use Steam's local CLI once instead; this remains an absolute local EXE
# launch (not a steam:// URI), and process/window detection still targets the
# Brotato.exe game process.  All title-screen navigation lives in menu_skip.
auto_launch:
  launch_path: "D:/App/STEAM/steam.exe"
  launch_args: ["-applaunch", "1942280"]
  window_wait_seconds: 180.0
  settle_seconds: 15.0

# Raw physical gamepad action set. Continuous stick and trigger values are
# supplied through generic protocol tokens such as `LS[0.5,-0.2]`.
actions:
  neutral: {description: 'Raw Xbox neutral state.'}
  a: {description: 'Raw Xbox A face button.', buttons: [A]}
  b: {description: 'Raw Xbox B face button.', buttons: [B]}
  x: {description: 'Raw Xbox X face button.', buttons: [X]}
  y: {description: 'Raw Xbox Y face button.', buttons: [Y]}
  lb: {description: 'Raw Xbox left shoulder button.', buttons: [LB]}
  rb: {description: 'Raw Xbox right shoulder button.', buttons: [RB]}
  ls: {description: 'Raw Xbox left-stick click.', buttons: [LS]}
  rs: {description: 'Raw Xbox right-stick click.', buttons: [RS]}
  dpad_up: {description: 'Raw Xbox D-pad up.', buttons: [DPAD_UP]}
  dpad_down: {description: 'Raw Xbox D-pad down.', buttons: [DPAD_DOWN]}
  dpad_left: {description: 'Raw Xbox D-pad left.', buttons: [DPAD_LEFT]}
  dpad_right: {description: 'Raw Xbox D-pad right.', buttons: [DPAD_RIGHT]}
  start: {description: 'Raw Xbox Start button.', buttons: [START]}
  back: {description: 'Raw Xbox Back button.', buttons: [BACK]}
  guide: {description: 'Raw Xbox Guide button.', buttons: [GUIDE]}
menu_skip:
  # Closed-loop replayed by the bench (press-until-screen-changes), so waits
  # are minimums, not exact timings. The no-save cleanup guarantees that the
  # main menu has no Resume entry: A selects Start, RIGHT selects Well-Rounded,
  # A confirms, RIGHT selects Knife, then A and A confirm Knife and Danger 0.
  - description: 'recorded: pad1 [A] held 0.11s'
    buttons:
      - A
    pad: 1
    duration_seconds: 0.11
  - description: wait 1.72s
    pad: 1
    duration_seconds: 1.72
  - description: 'recorded: pad1 [DPAD_RIGHT] held 0.08s'
    buttons:
      - DPAD_RIGHT
    pad: 1
    duration_seconds: 0.08
  - description: wait 1.17s
    pad: 1
    duration_seconds: 1.17
  - description: 'recorded: pad1 [A] held 0.08s'
    buttons:
      - A
    pad: 1
    duration_seconds: 0.08
  - description: wait 1.27s
    pad: 1
    duration_seconds: 1.27
  - description: 'recorded: pad1 [DPAD_RIGHT] held 0.05s'
    buttons:
      - DPAD_RIGHT
    pad: 1
    duration_seconds: 0.05
  - description: wait 1.20s
    pad: 1
    duration_seconds: 1.2
  - description: 'recorded: pad1 [A] held 0.11s'
    buttons:
      - A
    pad: 1
    duration_seconds: 0.11
  - description: wait 1.58s
    pad: 1
    duration_seconds: 1.58
  - description: 'recorded: pad1 [A] held 0.09s'
    buttons:
      - A
    pad: 1
    duration_seconds: 0.09
  - description: wait 1.00s (trailing — last input → SAVE)
    pad: 1
    duration_seconds: 1.00
