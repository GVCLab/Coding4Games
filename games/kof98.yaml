name: KingOfFighters98UMFE

# Verified: Steam appid 222420 is KOF '98 Ultimate Match Final Edition.
# Current native PrintWindow viewport: 854x480; physical client: 1281x720 at 150% DPI.
process: KingOfFighters98UM_x64.exe

scorer:
  kind: image
  implementation: kof98_terminal

description: |
  Fighting game (harness config). Neutral infrastructure description only; no gameplay hints.

# KOF uses DX9; PrintWindow captures correctly. Desktop duplication via dxcam denies SYSTEM/PsExec access.
screenshot_backend: printwindow

# Source: 427147c2ef50f9f1d039281f446c78d68d436989, games/kof98.yaml.
# The original host used Steam's local CLI because direct game launch handed
# control back to Steam. See docs/games/kof98/README.md for the task and evidence.
auto_launch:
  launch_path: "D:/App/STEAM/steam.exe"
  launch_args: ["-applaunch", "222420"]
  launch_method: desktop_shell
  window_wait_seconds: 180.0
  settle_seconds: 60.0

