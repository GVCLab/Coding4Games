    pad: 1
    duration_seconds: 1.41
  - description: 'recorded: pad1 [A] held 0.08s'
    buttons:
      - A
    pad: 1
    duration_seconds: 0.08
  - description: wait 1.03s
    pad: 1
    duration_seconds: 1.03
  - description: 'recorded: pad1 [A] held 0.09s'
    buttons:
      - A
    pad: 1
    duration_seconds: 0.09
  - description: wait 8.99s
    pad: 1
    duration_seconds: 8.99
  - description: 'recorded: pad1 [A] held 0.12s'
    buttons:
      - A
    pad: 1
    duration_seconds: 0.12
  - description: wait 1.38s
    pad: 1
    duration_seconds: 1.38
  - description: 'recorded: pad1 [A] held 0.08s'
    buttons:
