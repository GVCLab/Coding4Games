name: Balatro

process: Balatro.exe

# Balatro's LÖVE/SDL event loop needs to remain schedulable at zero game-time
# while raw gameplay pulses cross an OS-level hard-pause boundary.
use_speedhack: true

scorer:
  kind: ocr
  implementation: ocr

# Launch the installed game executable directly. Menu navigation remains in
# the recorded menu_skip below; no Steam URI or launcher prompt is involved.
auto_launch:
  launch_path: "E:/SteamLibrary/steamapps/common/Balatro/Balatro.exe"
  window_wait_seconds: 180.0
  settle_seconds: 30.0

description: |
  Balatro: a poker-themed roguelike deckbuilder. Each round you face a
  "Blind" with a chip target; you play up to N poker hands (and may discard
  to redraw) to reach it. Clearing a Blind pays money, which is spent in a
  shop on Jokers (persistent multipliers), consumables and packs. Three
  Blinds (Small / Big / Boss) make up an Ante; the run ends when a Blind is
  not beaten before hands run out (GAME OVER screen).

# ---------------------------------------------------------------------------
# RAW GAMEPAD ACTIONS. The policy sees physical XInput controls only. There
# are no CARD1/PLAY_HAND/SELECT_BLIND-style semantic aliases and no mouse
# coordinates in the action space. The controller focus ring is deliberately
# part of what the policy must discover and control.
# ---------------------------------------------------------------------------

actions:
  neutral: {description: 'Raw Xbox neutral state.'}
  a: {description: 'Raw Xbox A face button.', buttons: [A]}
  b: {description: 'Raw Xbox B face button.', buttons: [B]}
  x: {description: 'Raw Xbox X face button.', buttons: [X]}
  y: {description: 'Raw Xbox Y face button.', buttons: [Y]}
  lb: {description: 'Raw Xbox left shoulder button.', buttons: [LB]}
  rb: {description: 'Raw Xbox right shoulder button.', buttons: [RB]}
  ls: {description: 'Raw Xbox left-stick click.', buttons: [LS]}
  rs: {description: 'Raw Xbox right-stick click.', buttons: [RS]}
  dpad_up: {description: 'Raw Xbox D-pad up.', buttons: [DPAD_UP]}
  dpad_down: {description: 'Raw Xbox D-pad down.', buttons: [DPAD_DOWN]}
  dpad_left: {description: 'Raw Xbox D-pad left.', buttons: [DPAD_LEFT]}
  dpad_right: {description: 'Raw Xbox D-pad right.', buttons: [DPAD_RIGHT]}
  start: {description: 'Raw Xbox Start button.', buttons: [START]}
  back: {description: 'Raw Xbox Back button.', buttons: [BACK]}
  guide: {description: 'Raw Xbox Guide button.', buttons: [GUIDE]}

# Recorded raw-pad cold path from the title screen into a live run.
menu_skip:
  # Preserve the recorder's exact button timings; menu_skip is infrastructure
  # and is not part of the policy action space above.
  - description: 'recorded: pad1 [DPAD_DOWN] held 0.14s'
    buttons:
      - DPAD_DOWN
    pad: 1
    duration_seconds: 0.14
  - description: wait 0.83s
    pad: 1
    duration_seconds: 0.83
  - description: 'recorded: pad1 [A] held 0.11s'
    buttons:
      - A
    pad: 1
    duration_seconds: 0.11
  - description: wait 7.95s
    pad: 1
    duration_seconds: 7.95
  - description: 'recorded: pad1 [X] held 0.11s'
    buttons:
      - X
    pad: 1
    duration_seconds: 0.11
  - description: wait 10.05s (trailing — last input → SAVE)
    pad: 1
    duration_seconds: 10.05
