# Sekiro: Shadows Die Twice - Gyoubu Masataka Oniwa boss rematch.
#
# This scenario-specific driver owns the recorded title-to-encounter path for
# the dedicated Gyoubu golden save. Preserve the recording; never hand-write
# or retime it without a new recorder session and Full auto-launch evidence.

name: Sekiro - Gyoubu Masataka Oniwa
process: sekiro.exe

scorer:
  kind: image
  implementation: sekiro_boss

auto_launch:
  launch_path: "G:/SteamLibrary/steamapps/common/Sekiro/sekiro.exe"
  window_wait_seconds: 180.0
  settle_seconds: 60.0

save_state:
