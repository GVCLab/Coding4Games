      - A
    pad: 1
    duration_seconds: 0.05
  # A native cold start was still loading after 22.41s; the RT prompt was
  # visible by 52.5s. Leave loading margin before the recorded RT press.
  - description: wait 60.00s (calibrated Continue loading wait)
    pad: 1
    duration_seconds: 60.0
  - description: 'recorded: pad1 RT held 0.05s'
    right_trigger: 1.0
    pad: 1
