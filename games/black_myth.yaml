screenshot_backend: dxcam

description: |
  Black Myth: Wukong is a third-person action RPG inspired by Chinese
  mythology and Journey to the West. You control the Destined One in
  real-time staff combat, combining movement, camera control, lock-on,
  dodges, light and heavy attacks, spells, and limited gourd healing.

  This configuration starts from a fixed save immediately before a boss
  encounter. The immediate goal is to defeat the visible boss. Observe its
  attack animations, dodge or reposition to avoid damage, attack during
  recovery windows, manage stamina and healing, and use available spells
  when useful. The episode does not require exploration, equipment
  management, menu navigation, or chapter progression.

actions:
  neutral: {description: 'Raw Xbox neutral state.'}
  a: {description: 'Raw Xbox A face button.', buttons: [A]}
  b: {description: 'Raw Xbox B face button.', buttons: [B]}
  x: {description: 'Raw Xbox X face button.', buttons: [X]}
  y: {description: 'Raw Xbox Y face button.', buttons: [Y]}
  lb: {description: 'Raw Xbox left shoulder button.', buttons: [LB]}
  rb: {description: 'Raw Xbox right shoulder button.', buttons: [RB]}
  ls: {description: 'Raw Xbox left-stick click.', buttons: [LS]}
  rs: {description: 'Raw Xbox right-stick click.', buttons: [RS]}
  dpad_up: {description: 'Raw Xbox D-pad up.', buttons: [DPAD_UP]}
  dpad_down: {description: 'Raw Xbox D-pad down.', buttons: [DPAD_DOWN]}
  dpad_left: {description: 'Raw Xbox D-pad left.', buttons: [DPAD_LEFT]}
  dpad_right: {description: 'Raw Xbox D-pad right.', buttons: [DPAD_RIGHT]}
  start: {description: 'Raw Xbox Start button.', buttons: [START]}
  back: {description: 'Raw Xbox Back button.', buttons: [BACK]}
  guide: {description: 'Raw Xbox Guide button.', buttons: [GUIDE]}
save_state:
  # Steam account id differs between machines. The save loader resolves the
  # single wildcard to the first account directory under SaveGames.
  restore_to: 'E:/SteamLibrary/steamapps/common/BlackMythWukong/b1/Saved/SaveGames/*'
  process_cmdline_contains: 'b1-Win64-Shipping'
