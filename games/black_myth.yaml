# Black Myth: Wukong — Souls-like 3D action RPG.
#
# Default Xbox controller layout, cross-checked against:
#   - https://blackmythwukong.wiki.fextralife.com/Controls
#   - https://primagames.com/tips/black-myth-wukong-complete-controls-for-pc-controller
#
# Note: triggers (LT/RT) are NOT plain buttons in this codebase — they must be
# driven via the `left_trigger` / `right_trigger` float fields, not by listing
# 'LT' / 'RT' inside `buttons`. Modifier combos like RT + face button are
# expressed by setting `right_trigger: 1.0` AND `buttons: [<face>]` together.

name: BlackMythWukong
process: b1-Win64-Shipping.exe

scorer:
  kind: image
  implementation: black_myth

# Launch the Shipping executable directly.  The top-level b1.exe bootstrap
# asks Steam to start the game with a custom "b1" parameter, which opens an
# interactive confirmation dialog and breaks unattended cold starts.
auto_launch:
  launch_path: "E:/SteamLibrary/steamapps/common/BlackMythWukong/b1/Binaries/Win64/b1-Win64-Shipping.exe"
  window_wait_seconds: 180.0
  settle_seconds: 60.0

# MANUAL GATE: record the exact title-screen -> fixed boss encounter path
# after creating the golden save. The Continue loading wait below was
# calibrated separately; all recorded input holds remain unchanged.
#   python scripts/record_pad_to_yaml.py --game black_myth --section menu_skip
menu_skip:
  - description: 'recorded: pad1 [A] held 0.09s'
    buttons:
      - A
    pad: 1
    duration_seconds: 0.09
