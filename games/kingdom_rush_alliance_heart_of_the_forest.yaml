name: 'Kingdom Rush 5: Alliance — The Heart of the Forest'
process: Kingdom Rush Alliance.exe
scorer:
  kind: ocr
  implementation: kingdom_rush_alliance
screenshot_backend: printwindow
description: 'Kingdom Rush 5: Alliance (Steam AppID 2849080), a real-time tower-defense

  game.  The benchmark uses the game''s unmodified default Xbox controller

  preset and exposes only the raw physical controls listed below.  Continuous

  stick and trigger values are supplied by the generic Windows protocol.

  '
save_state:
  restore_to: '%APPDATA%/kingdom_rush_alliance'
  wipe_before: true
auto_launch:
  launch_path: G:/SteamLibrary/steamapps/common/Kingdom Rush Alliance/Kingdom Rush Alliance.exe
  window_wait_seconds: 180.0
  settle_seconds: 60.0
actions:
  neutral:
    description: Raw Xbox neutral state.
  a:
    description: Raw Xbox A face button.
    buttons:
      - A
  b:
    description: Raw Xbox B face button.
    buttons:
      - B
  x:
    description: Raw Xbox X face button.
    buttons:
      - X
  y:
    description: Raw Xbox Y face button.
    buttons:
      - Y
  lb:
    description: Raw Xbox left shoulder button.
    buttons:
      - LB
  rb:
    description: Raw Xbox right shoulder button.
    buttons:
      - RB
  ls:
    description: Raw Xbox left-stick click.
    buttons:
      - LS
  rs:
    description: Raw Xbox right-stick click.
    buttons:
      - RS
  dpad_up:
    description: Raw Xbox D-pad up.
    buttons:
      - DPAD_UP
  dpad_down:
    description: Raw Xbox D-pad down.
    buttons:
      - DPAD_DOWN
  dpad_left:
    description: Raw Xbox D-pad left.
    buttons:
      - DPAD_LEFT
  dpad_right:
    description: Raw Xbox D-pad right.
    buttons:
      - DPAD_RIGHT
  start:
    description: Raw Xbox Start button.
    buttons:
      - START
  back:
    description: Raw Xbox Back button.
    buttons:
      - BACK
  guide:
    description: Raw Xbox Guide button.
    buttons:
      - GUIDE
menu_skip:
  - description: 'recorded: pad1 [DPAD_DOWN] held 0.09s'
    buttons:
      - DPAD_DOWN
    pad: 1
    duration_seconds: 0.09
  - description: wait 0.62s
    pad: 1
    duration_seconds: 0.62
  - description: 'recorded: pad1 [DPAD_DOWN] held 0.09s'
    buttons:
      - DPAD_DOWN
    pad: 1
    duration_seconds: 0.09
  - description: wait 1.44s
    pad: 1
    duration_seconds: 1.44
  - description: 'recorded: pad1 [DPAD_UP] held 0.09s'
    buttons:
      - DPAD_UP
    pad: 1
    duration_seconds: 0.09
  - description: wait 2.86s
    pad: 1
    duration_seconds: 2.86
  - description: 'recorded: pad1 [A] held 0.09s'
    buttons:
      - A
    pad: 1
    duration_seconds: 0.09
  - description: wait 1.39s
    pad: 1
    duration_seconds: 1.39
  - description: 'recorded: pad1 [DPAD_DOWN] held 0.09s'
    buttons:
      - DPAD_DOWN
    pad: 1
    duration_seconds: 0.09
  - description: wait 2.33s
    pad: 1
    duration_seconds: 2.33
  - description: 'recorded: pad1 [A] held 0.08s'
    buttons:
      - A
    pad: 1
    duration_seconds: 0.08
  - description: wait 4.08s
    pad: 1
    duration_seconds: 4.08
  - description: 'recorded: pad1 [DPAD_UP] held 0.09s'
    buttons:
      - DPAD_UP
    pad: 1
    duration_seconds: 0.09
  - description: wait 0.61s
    pad: 1
    duration_seconds: 0.61
  - description: 'recorded: pad1 [DPAD_UP] held 0.11s'
