# Source and migration limits: docs/GAME_INTEGRATION_20261020.zh.md
name: BattleBlock Theater
process: BattleBlockTheater.exe
platform: windows-kbm
screenshot_backend: dxcam
ime_context_mode: disabled
scorer:
  kind: image
  implementation: bbt_progress
description: 'BattleBlock Theater: a 2D side-scrolling platformer. You run and jump

  across platforms to reach each level''s exit, avoiding hazards (spikes,

  water, saws) and collecting green gems and gold along the way. Movement

  is left/right; jump (hold longer to jump higher), headbutt-attack, and

  grab / push objects. A level''s exit only opens once enough gems have been

  collected. Menus are navigated with the direction keys and confirmed or

  cancelled with the confirm / cancel actions.

  '
auto_launch:
  launch_path: G:/SteamLibrary/steamapps/common/BattleBlock Theater/BattleBlockTheater.exe
  window_wait_seconds: 180.0
  # Operator selected a 30-second preparation wait on 2026-10-25.
  settle_seconds: 30.0
save_state:
  # This host's checkpoint was generated through the game's native recovery.
  # Saves are account-bound; the preserved source golden belongs to another
  # account and is rejected by this installation. See the diagnosis document.
  # Steam currently reports ActiveUser=0 despite its existing logged-on session.
  # Keep this game's Steam Cloud disabled for checkpoint restoration.
  restore_to: 'D:/App/STEAM/userdata/1509794311/238460'
  golden: snapshots/battleblock_current_account_golden.zip
window:
  size:
  - 1280
  - 720
  toggle: ALT_ENTER
actions:
  neutral:
    description: Raw Xbox neutral state.
  a:
    description: Raw Xbox A face button.
    buttons:
    - A
  b:
    description: Raw Xbox B face button.
    buttons:
    - B
  x:
    description: Raw Xbox X face button.
    buttons:
    - X
  y:
    description: Raw Xbox Y face button.
    buttons:
    - Y
  lb:
    description: Raw Xbox left shoulder button.
    buttons:
    - LB
  rb:
    description: Raw Xbox right shoulder button.
    buttons:
    - RB
  ls:
    description: Raw Xbox left-stick click.
    buttons:
    - LS
  rs:
    description: Raw Xbox right-stick click.
    buttons:
    - RS
  dpad_up:
    description: Raw Xbox D-pad up.
    buttons:
    - DPAD_UP
  dpad_down:
    description: Raw Xbox D-pad down.
    buttons:
    - DPAD_DOWN
  dpad_left:
    description: Raw Xbox D-pad left.
    buttons:
    - DPAD_LEFT
  dpad_right:
    description: Raw Xbox D-pad right.
    buttons:
    - DPAD_RIGHT
  start:
    description: Raw Xbox Start button.
    buttons:
    - START
  back:
    description: Raw Xbox Back button.
    buttons:
    - BACK
  guide:
    description: Raw Xbox Guide button.
    buttons:
    - GUIDE
