name: Aimlabs
process: AimLab_tb.exe
platform: windows-kbm
screenshot_backend: dxcam
use_speedhack: true
scorer: {kind: ocr, implementation: ocr}

description: |
  Aimlabs fixed-task startup calibration for Gridshot 3x3.
  The 30-second round settles from the labeled killed-target count on its results screen.

# Use Steam's library launch so the client supplies the platform context.
# Direct runtime launch reached sign-in with uninitialized Steamworks.
# Account task loading exceeded the old 20-second settle on the current host.
# Mouse coordinates below were observed at a 2048x1152 client size.

auto_launch:
  launch_path: 'D:/App/STEAM/steam.exe'
  launch_args: ['-applaunch', '714010']
  window_wait_seconds: 180.0
  settle_seconds: 60.0

menu_skip:
- description: 'Open the home-screen task search.'
  click: [78, 54]
  duration_seconds: 2.801307500049006
  expect: 'Search\s*results'
- description: 'Focus the task query field before entering the exact title.'
  click: [695, 210]
  duration_seconds: 1.186662600026466
- description: 'Search for the exact Gridshot 3x3 task.'
  type_text: 'Gridshot 3x3'
  duration_seconds: 0.15
- description: 'Wait for the search results list to finish loading.'
  duration_seconds: 10.0
  expect: '(?is)Search\s*results\s*[:：]\s*\d+\s+GRIDSHOT\s*3X3\s+whoisaqua\b'
- description: 'Select the first result: Gridshot 3x3 by whoisaqua.'
  click: [800, 319]
  duration_seconds: 10.787020399991889
- description: 'Observed loading gap between the loading and task-ready captures.'
  duration_seconds: 105.09508872032166
- description: 'Click the exercise start prompt.'
  click_current: true
  duration_seconds: 0.15
- description: 'Observed 3.5-second start pulse before the running HUD capture.'
  duration_seconds: 3.5001947000273503

actions:
  neutral: {description: 'Raw Xbox neutral state.'}
  a: {description: 'Raw Xbox A face button.', buttons: [A]}
  b: {description: 'Raw Xbox B face button.', buttons: [B]}
  x: {description: 'Raw Xbox X face button.', buttons: [X]}
  y: {description: 'Raw Xbox Y face button.', buttons: [Y]}
  lb: {description: 'Raw Xbox left shoulder button.', buttons: [LB]}
  rb: {description: 'Raw Xbox right shoulder button.', buttons: [RB]}
  ls: {description: 'Raw Xbox left-stick click.', buttons: [LS]}
  rs: {description: 'Raw Xbox right-stick click.', buttons: [RS]}
  dpad_up: {description: 'Raw Xbox D-pad up.', buttons: [DPAD_UP]}
  dpad_down: {description: 'Raw Xbox D-pad down.', buttons: [DPAD_DOWN]}
  dpad_left: {description: 'Raw Xbox D-pad left.', buttons: [DPAD_LEFT]}
  dpad_right: {description: 'Raw Xbox D-pad right.', buttons: [DPAD_RIGHT]}
  start: {description: 'Raw Xbox Start button.', buttons: [START]}
  back: {description: 'Raw Xbox Back button.', buttons: [BACK]}
