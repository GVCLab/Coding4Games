name: Riders Republic

# Steam app 2290180. A local path override can select a specific library copy.
# Ubisoft Connect authentication remains a separate startup prerequisite.
process: RidersRepublic.exe

# The installed build is DirectX 12. Keep the game visible and use borderless
# or windowed mode because dxcam captures the screen region.
screenshot_backend: dxcam

scorer:
  kind: ocr
  implementation: riders_republic

description: |
  Riders Republic in Zen Mode, the game's offline free-roam mode. This driver
  exposes raw Xbox-compatible controller state. The benchmark scenario defines
  the task and scoring semantics.

actions:
  neutral: {description: 'Raw Xbox neutral state.'}
  a: {description: 'Raw Xbox A face button.', buttons: [A]}
  b: {description: 'Raw Xbox B face button.', buttons: [B]}
  x: {description: 'Raw Xbox X face button.', buttons: [X]}
  y: {description: 'Raw Xbox Y face button.', buttons: [Y]}
  lb: {description: 'Raw Xbox left shoulder button.', buttons: [LB]}
  rb: {description: 'Raw Xbox right shoulder button.', buttons: [RB]}
  ls: {description: 'Raw Xbox left-stick click.', buttons: [LS]}
  rs: {description: 'Raw Xbox right-stick click.', buttons: [RS]}
  dpad_up: {description: 'Raw Xbox D-pad up.', buttons: [DPAD_UP]}
  dpad_down: {description: 'Raw Xbox D-pad down.', buttons: [DPAD_DOWN]}
  dpad_left: {description: 'Raw Xbox D-pad left.', buttons: [DPAD_LEFT]}
  dpad_right: {description: 'Raw Xbox D-pad right.', buttons: [DPAD_RIGHT]}
  start: {description: 'Raw Xbox Start button.', buttons: [START]}
  back: {description: 'Raw Xbox Back button.', buttons: [BACK]}
  guide: {description: 'Raw Xbox Guide button.', buttons: [GUIDE]}

auto_launch:
  launch_path: "C:/Program Files (x86)/Steam/steamapps/common/RidersRepublic/RidersRepublic.exe"
  launch_method: desktop_shell
  # A save restore restarts the Ubisoft session; on this host the game window
  # has appeared just after the former 180-second boundary.
  window_wait_seconds: 300.0
  settle_seconds: 60.0

save_state:
  golden: snapshots/riders_republic_current_account_20261110.zip
  # Supply the exact signed-in Ubisoft account's save directory in games.local.json.
  restore_to: null
  extra_kill:
    - RidersRepublic_BE.exe
    - UbisoftGameLauncher.exe
    - upc.exe

# Must be captured from the real post-settle title screen with the recorder.
menu_skip:
  - description: 'recorded: pad1 [A] held 0.12s'
    buttons:
      - A
    pad: 1
    duration_seconds: 0.12
  - description: wait 21.81s
    pad: 1
    duration_seconds: 21.81
  - description: 'recorded: pad1 [DPAD_DOWN] held 0.06s'
    buttons:
      - DPAD_DOWN
    pad: 1
    duration_seconds: 0.06
  - description: wait 0.81s
    pad: 1
    duration_seconds: 0.81
  - description: 'recorded: pad1 [A] held 0.09s'
    buttons:
      - A
    pad: 1
    duration_seconds: 0.09
  - description: wait 22.31s
    pad: 1
    duration_seconds: 22.31
    expect: '(?:欢迎来到禅模式|WELCOME.*ZEN|SCORE|得分)'
  - description: 'recorded: pad1 [A] held 0.05s'
    buttons:
      - A
    pad: 1
    duration_seconds: 0.05
    expect: '(?:SCORE|得分)'
    expect_absent: '(?:欢迎来到禅模式|WELCOME.*ZEN)'
  - description: wait 4.38s (trailing — last input → SAVE)
    pad: 1
    duration_seconds: 4.38
